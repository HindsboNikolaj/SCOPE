<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 760" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">SCOPE architecture: a tool-using camera agent</title>
  <desc id="desc">A user sends a natural-language request to AgentClient. AgentClient exchanges messages, tool definitions, tool calls, and answers with an OpenAI-compatible small language model served by Ollama or vLLM. AgentClient invokes PTZ and perception tools in Blender. PTZ tools move the camera and choose presets; perception tools run vision-model inference over rendered frames from the Blender scene. Text tool results return to the agent.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef4ff"/></linearGradient>
    <linearGradient id="agent" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="model" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f3e8ff"/><stop offset="1" stop-color="#ede9fe"/></linearGradient>
    <linearGradient id="scene" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#dcfce7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity=".12"/></filter>
    <marker id="arrow-blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#7c3aed"/></marker>
    <marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#0f766e"/></marker>
    <marker id="arrow-coral" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#e11d48"/></marker>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0 H0 V16" fill="none" stroke="#10b981" stroke-opacity=".12" stroke-width="1"/></pattern>
    <style>
      .eyebrow { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
      .title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 32px; font-weight: 750; fill: #0f172a; }
      .subtitle { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 16px; font-weight: 450; fill: #475569; }
      .card-title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 20px; font-weight: 750; fill: #0f172a; }
      .card-detail { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #1d4ed8; }
      .edge-label { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 650; fill: #475569; }
      .mini { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 650; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#canvas)"/>
  <rect x="24" y="24" width="1152" height="712" rx="24" fill="#ffffff" fill-opacity=".92" stroke="#dbe4f0" stroke-width="2"/>
  <text x="64" y="72" class="eyebrow" fill="#2563eb">SCOPE ARCHITECTURE</text>
  <text x="64" y="112" class="title">Natural language in. Camera actions and grounded answers out.</text>
  <text x="64" y="140" class="subtitle">A lightweight agent loop keeps the planner, tools, and visual world independently replaceable.</text>
  <path d="M64 168 H1136" stroke="#dbe4f0" stroke-width="2"/>

  <!-- High-level interaction -->
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="184" height="128" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="88" y="208" width="40" height="40" rx="12" fill="#e2e8f0"/>
    <path d="M100 232 C100 222 116 222 116 232 M104 220 A8 8 0 1 0 120 220 A8 8 0 1 0 104 220" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <text x="144" y="228" class="card-title">User prompt</text>
    <text x="144" y="252" class="card-detail">Ask in plain language</text>
    <rect x="88" y="272" width="136" height="20" rx="10" fill="#e2e8f0"/>
    <text x="156" y="286" class="mini" text-anchor="middle">intent + constraints</text>

    <rect x="328" y="152" width="320" height="192" rx="20" fill="url(#agent)" stroke="#2563eb" stroke-width="2"/>
    <rect x="352" y="176" width="48" height="48" rx="14" fill="#2563eb"/>
    <path d="M364 192 H388 M364 204 H380 M364 216 H388" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="416" y="196" class="card-title">AgentClient</text>
    <text x="416" y="220" class="code">scope/agent/client.py</text>
    <path d="M352 240 H624" stroke="#93c5fd" stroke-width="2"/>
    <text x="352" y="268" class="card-detail">Runs the tool-use loop, routes calls,</text>
    <text x="352" y="292" class="card-detail">and returns a final answer.</text>
    <rect x="352" y="312" width="128" height="20" rx="10" fill="#bfdbfe"/>
    <text x="416" y="326" class="mini" text-anchor="middle" fill="#1d4ed8">ORCHESTRATION</text>

    <rect x="752" y="152" width="384" height="192" rx="20" fill="url(#model)" stroke="#7c3aed" stroke-width="2"/>
    <rect x="776" y="176" width="48" height="48" rx="14" fill="#7c3aed"/>
    <path d="M788 192 H812 M788 204 H804 M788 216 H812" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <text x="840" y="196" class="card-title">OpenAI-compatible SLM</text>
    <text x="840" y="220" class="card-detail">Ollama or vLLM</text>
    <path d="M776 240 H1112" stroke="#d8b4fe" stroke-width="2"/>
    <text x="776" y="268" class="card-detail">Plans with tool definitions and</text>
    <text x="776" y="292" class="card-detail">selects actions or writes an answer.</text>
    <rect x="776" y="312" width="156" height="20" rx="10" fill="#ddd6fe"/>
    <text x="854" y="326" class="mini" text-anchor="middle" fill="#6d28d9">PLANNER</text>
  </g>

  <!-- Request and planner exchange -->
  <path d="M248 216 H320" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="284" y="204" class="edge-label" text-anchor="middle">request</text>
  <path d="M328 280 H256" stroke="#0f766e" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/>
  <text x="288" y="300" class="edge-label" text-anchor="middle">final answer</text>
  <path d="M648 216 H744" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="696" y="196" class="edge-label" text-anchor="middle">messages + tools</text>
  <path d="M752 280 H656" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#arrow-purple)"/>
  <text x="704" y="300" class="edge-label" text-anchor="middle">tool calls / answer</text>

  <!-- Execution layer -->
  <rect x="128" y="408" width="944" height="224" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="160" y="392" width="212" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="266" y="414" class="eyebrow" text-anchor="middle" fill="#475569">TOOL EXECUTION LAYER</text>

  <path d="M488 344 V376 H348 V472" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M488 344 V376 H852 V472" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="416" y="356" width="144" height="24" rx="12" fill="#dbeafe"/>
  <text x="488" y="373" class="mini" text-anchor="middle" fill="#1d4ed8">JSON TOOL CALLS</text>
  <path d="M348 480 V432 H440 V344" stroke="#0f766e" stroke-width="2" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow-teal)"/>
  <path d="M852 480 V432 H536 V344" stroke="#0f766e" stroke-width="2" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow-teal)"/>
  <text x="600" y="448" class="edge-label" text-anchor="middle" fill="#0f766e">text tool results return to the agent</text>

  <g filter="url(#shadow)">
    <rect x="184" y="480" width="328" height="112" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <rect x="208" y="504" width="40" height="40" rx="12" fill="#ffe4e6"/>
    <path d="M216 528 H240 M224 516 V540 M220 520 L228 512 L236 520 L228 528 Z" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="264" y="524" class="card-title">PTZ tools</text>
    <text x="264" y="548" class="card-detail">Move, zoom, and select presets</text>
    <text x="264" y="572" class="code" fill="#be123c">Blender / bpy camera</text>

    <rect x="688" y="480" width="328" height="112" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <rect x="712" y="504" width="40" height="40" rx="12" fill="#cffafe"/>
    <path d="M720 532 L728 516 L736 532 L744 516 L752 532 M720 536 H752" fill="none" stroke="#0e7490" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="768" y="524" class="card-title">Perception tools</text>
    <text x="768" y="548" class="card-detail">VLM inference over scene frames</text>
    <text x="768" y="572" class="code" fill="#0e7490">vision-model adapter</text>
  </g>

  <!-- Scene -->
  <rect x="280" y="656" width="640" height="80" rx="20" fill="url(#scene)" stroke="#059669" stroke-width="2"/>
  <rect x="280" y="656" width="640" height="80" rx="20" fill="url(#grid)"/>
  <rect x="312" y="676" width="40" height="40" rx="12" fill="#d1fae5"/>
  <path d="M320 692 H344 L352 700 V708 H320 Z M332 692 V684 H340 V692" fill="none" stroke="#047857" stroke-width="2" stroke-linejoin="round"/>
  <text x="376" y="692" class="card-title">Blender 3D Scene</text>
  <text x="376" y="716" class="card-detail">bpy camera · presets · rendered frames</text>
  <rect x="760" y="680" width="128" height="24" rx="12" fill="#bbf7d0"/>
  <text x="824" y="697" class="mini" text-anchor="middle" fill="#047857">VISUAL WORLD</text>

  <path d="M348 592 V632 H456 V648" stroke="#e11d48" stroke-width="3" fill="none" marker-end="url(#arrow-coral)"/>
  <text x="400" y="620" class="edge-label" text-anchor="middle" fill="#be123c">camera action</text>
  <path d="M744 648 V632 H852 V600" stroke="#0891b2" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow-teal)"/>
  <text x="800" y="620" class="edge-label" text-anchor="middle" fill="#0e7490">rendered frame</text>
</svg>
