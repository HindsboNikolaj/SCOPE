<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 760" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">SCOPE AgentClient high-level architecture</title>
  <desc id="desc">A user prompt enters AgentClient. AgentClient exchanges messages and tool calls with an OpenAI-compatible small language model server such as Ollama or vLLM. AgentClient invokes PTZ and perception tools in Blender. PTZ tools update the Blender camera; perception tools receive rendered frames from the Blender scene. Text tool results return to AgentClient.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#334155" flood-opacity=".10"/></filter>
    <marker id="blue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2563eb"/></marker>
    <marker id="purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#7c3aed"/></marker>
    <marker id="teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#0f766e"/></marker>
    <marker id="coral" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#e11d48"/></marker>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0 H0 V16" fill="none" stroke="#10b981" stroke-opacity=".10" stroke-width="1"/></pattern>
    <style>
      .kicker { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .12em; fill: #2563eb; }
      .heading { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 26px; font-weight: 750; fill: #0f172a; }
      .subheading { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #475569; }
      .card-title { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 18px; font-weight: 750; fill: #0f172a; }
      .card-detail { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #475569; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 650; fill: #1d4ed8; }
      .edge { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 12px; font-weight: 650; fill: #475569; }
      .smallcaps { font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-size: 11px; font-weight: 750; letter-spacing: .10em; fill: #64748b; }
    </style>
  </defs>

  <rect width="1120" height="760" fill="#f8fafc"/>
  <rect x="24" y="24" width="1072" height="712" rx="24" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>
  <text x="48" y="64" class="kicker">SCOPE ARCHITECTURE</text>
  <text x="48" y="96" class="heading">Agent loop: high-level overview</text>
  <text x="48" y="120" class="subheading">The planner decides; tools execute and return grounded text observations.</text>
  <path d="M48 144 H1072" stroke="#dbe4f0" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="48" y="192" width="168" height="96" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="132" y="232" class="card-title" text-anchor="middle">User prompt</text>
    <text x="132" y="256" class="card-detail" text-anchor="middle">natural-language request</text>

    <rect x="280" y="176" width="256" height="128" rx="18" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/>
    <rect x="304" y="200" width="12" height="48" rx="6" fill="#2563eb"/>
    <text x="336" y="216" class="card-title">AgentClient</text>
    <text x="336" y="240" class="code">scope/agent/client.py</text>
    <path d="M304 256 H512" stroke="#93c5fd" stroke-width="2"/>
    <text x="304" y="280" class="card-detail">routes calls and owns history</text>

    <rect x="672" y="176" width="400" height="128" rx="18" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="696" y="200" width="12" height="48" rx="6" fill="#7c3aed"/>
    <text x="728" y="216" class="card-title">OpenAI-compatible SLM server</text>
    <text x="728" y="240" class="card-detail">Ollama or vLLM</text>
    <path d="M696 256 H1048" stroke="#d8b4fe" stroke-width="2"/>
    <text x="696" y="280" class="card-detail">selects a tool or writes the answer</text>
  </g>

  <path d="M216 240 H272" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <text x="244" y="224" class="edge" text-anchor="middle">prompt</text>
  <path d="M536 216 H664" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <text x="600" y="200" class="edge" text-anchor="middle">messages + tools</text>
  <path d="M672 264 H544" stroke="#7c3aed" stroke-width="3" fill="none" marker-end="url(#purple)"/>
  <text x="608" y="284" class="edge" text-anchor="middle">tool calls / answer</text>

  <rect x="128" y="416" width="864" height="184" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="8 8"/>
  <rect x="152" y="400" width="208" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="256" y="422" class="smallcaps" text-anchor="middle">TOOL EXECUTION</text>

  <path d="M408 304 V384 H300 V464" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <path d="M408 304 V384 H808 V464" stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#blue)"/>
  <rect x="336" y="332" width="144" height="24" rx="12" fill="#dbeafe"/>
  <text x="408" y="349" class="smallcaps" text-anchor="middle" fill="#1d4ed8">JSON TOOL CALLS</text>
  <path d="M300 472 V432 H320 V304" stroke="#0f766e" stroke-width="2" fill="none" stroke-dasharray="8 8" marker-end="url(#teal)"/>
  <path d="M808 472 V432 H496 V304" stroke="#0f766e" stroke-width="2" fill="none" stroke-dasharray="8 8" marker-end="url(#teal)"/>
  <rect x="528" y="440" width="144" height="24" rx="12" fill="#f8fafc"/>
  <text x="600" y="457" class="edge" text-anchor="middle" fill="#0f766e">text tool results</text>

  <g filter="url(#shadow)">
    <rect x="160" y="472" width="280" height="96" rx="16" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
    <text x="184" y="508" class="card-title">PTZ tools</text>
    <text x="184" y="532" class="card-detail">Blender camera control</text>
    <text x="184" y="552" class="code" fill="#be123c">move · zoom · preset</text>

    <rect x="648" y="472" width="320" height="96" rx="16" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="672" y="508" class="card-title">Perception tools</text>
    <text x="672" y="532" class="card-detail">VLM inference over scene frames</text>
    <text x="672" y="552" class="code" fill="#0e7490">count · query · frame object</text>
  </g>

  <path d="M300 568 V624 H440 V648" stroke="#e11d48" stroke-width="3" fill="none" marker-end="url(#coral)"/>
  <text x="392" y="620" class="edge" text-anchor="middle" fill="#be123c">camera action</text>
  <path d="M680 648 V624 H808 V576" stroke="#0f766e" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#teal)"/>
  <text x="744" y="620" class="edge" text-anchor="middle" fill="#0e7490">rendered frame</text>

  <rect x="320" y="656" width="480" height="64" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <rect x="320" y="656" width="480" height="64" rx="18" fill="url(#grid)"/>
  <text x="352" y="684" class="card-title">Blender 3D Scene</text>
  <text x="352" y="708" class="card-detail">bpy camera · presets · rendered frames</text>
  <rect x="672" y="672" width="96" height="24" rx="12" fill="#bbf7d0"/>
  <text x="720" y="689" class="smallcaps" text-anchor="middle" fill="#047857">VISUAL WORLD</text>
</svg>
